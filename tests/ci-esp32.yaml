# Compile-only config for CI, plain ESP32. Catches ESPHome API drift that the
# C6 build alone might not surface. Exercises the candela code path.

esphome:
  name: ci-yeelight-esp32

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: 5.5.5

external_components:
  - source:
      type: local
      path: ../components
    components: [yeelight_bt]

logger:
  level: DEBUG

wifi:
  ssid: "ci-ssid"
  password: "ci-password"

esp32_ble_tracker:
  software_coexistence: true

ble_client:
  - id: lamp_ble
    mac_address: "F8:24:41:11:22:33"

light:
  - platform: yeelight_bt
    id: lamp
    name: "CI Candela"
    ble_client_id: lamp_ble
    model: candela
    poll_interval: 0s
    write_interval: 100ms
